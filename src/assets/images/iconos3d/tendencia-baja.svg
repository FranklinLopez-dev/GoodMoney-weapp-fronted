<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="El tipo de cambio baja">
  <!--
    Sustituto del 3D del mockup: fajo rojo bajando (alerta de VENTA).
    Mismo criterio que tendencia-sube.svg: las ilustraciones del diseño no
    existen en el archivo de Figma, así que esto las reemplaza con los tokens
    de la marca. Es un fajo de billetes porque en VENTA el cliente compra
    dólares y lo que baja es lo que paga.
  -->
  <defs>
    <linearGradient id="tb-billete" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E86B6B"/>
      <stop offset="1" stop-color="#C63C3C"/>
    </linearGradient>
    <linearGradient id="tb-flecha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E05A5A"/>
      <stop offset="1" stop-color="#B22F2F"/>
    </linearGradient>
    <radialGradient id="tb-fondo" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FDEAEA"/>
      <stop offset="1" stop-color="#F8D3D3"/>
    </radialGradient>
  </defs>

  <circle cx="48" cy="48" r="44" fill="url(#tb-fondo)"/>
  <ellipse cx="46" cy="74" rx="26" ry="4.5" fill="#B22F2F" opacity="0.16"/>

  <!-- Fajo: tres billetes apilados, el de arriba ligeramente girado -->
  <rect x="20" y="60" width="52" height="11" rx="3" fill="#A83232"/>
  <rect x="22" y="52" width="52" height="11" rx="3" fill="#C63C3C"/>
  <g transform="rotate(-6 48 48)">
    <rect x="21" y="42" width="52" height="13" rx="3.5" fill="url(#tb-billete)"/>
    <circle cx="47" cy="48.5" r="4.2" fill="#FFFFFF" opacity="0.55"/>
    <rect x="26" y="46.5" width="9" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
    <rect x="59" y="46.5" width="9" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Flecha bajando -->
  <path d="M26 20 L41 33 L53 25 L68 41" fill="none" stroke="url(#tb-flecha)"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M57 43 L70 43 L70 30" fill="none" stroke="url(#tb-flecha)"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
