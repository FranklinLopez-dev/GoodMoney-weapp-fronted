<div class="kpi-grid">

  <div class="kpi-card">
    <div class="kpi-title">Compras</div>
    <div class="kpi-value">
      {{ totalCompras() | number:'1.0-2' }}
    </div>
  </div>

  <div class="kpi-card">
    <div class="kpi-title">Ventas</div>
    <div class="kpi-value">
      {{ totalVentas() | number:'1.0-2' }}
    </div>
  </div>

  @if (isAdmin) {
    <div class="kpi-card">
      <div class="kpi-title">Usuarios</div>
      <div class="kpi-value">
        {{ totalUsers() | number }}
      </div>
    </div>
  }

</div>
