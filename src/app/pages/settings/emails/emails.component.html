<mat-card>
  <mat-card-content>

    <div class="d-flex justify-content-between m-b-20">
      <h3>Correos</h3>
      <button mat-flat-button color="primary" (click)="create()">Nuevo correo</button>
    </div>

    @if(loading()) {
    <mat-spinner></mat-spinner>
    } @else {

    <div class="table-responsive tabla-tarjetas">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let e" class="td-cabecera">{{ e.code }}</td>
      </ng-container>

      <ng-container matColumnDef="subject">
        <th mat-header-cell *matHeaderCellDef>Asunto</th>
        <td mat-cell *matCellDef="let e" data-label="Asunto">{{ e.subject }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let e" data-label="Estado">
          <!-- Etiqueta de estado de la biblioteca: en texto plano no se distinguía de una celda cualquiera. -->
          <span class="gm-insignia" [class.gm-insignia--exito]="e.isActive"
            [class.gm-insignia--error]="!e.isActive">
            {{ e.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let e">
          <a (click)="edit(e)"><i-tabler name="edit"></i-tabler></a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>
    </div>
    }

  </mat-card-content>
</mat-card>
