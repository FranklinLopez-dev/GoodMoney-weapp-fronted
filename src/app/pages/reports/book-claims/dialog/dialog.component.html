<h2 mat-dialog-title>Agregar reclamo</h2>
<mat-dialog-content>
    <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
            <input maxlength="300" matInput type="number" #code />
        </mat-form-field>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close class="b-1 border-warning text-warning">
        Cerrar
    </button>
    <button class="text-white bg-secondary" (click)="openCode(code.value)" mat-button>
        Agregar
    </button>
</mat-dialog-actions>
