<div class="splash-container">
  <div class="splash-content">
    <div class="splash-logo">
      <img src="./assets/images/logos/icono.png" alt="Good Money" class="logo-image">
    </div>

    <div class="loading-spinner">
      <div class="spinner"></div>
    </div>

    <div class="splash-text">
      <h2 class="splash-title">{{ title }}</h2>
      <p class="splash-subtitle">{{ subtitle }}</p>
    </div>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    @if (showTips) {
    <div class="splash-tips">
      <div class="tip-item">
        <i-tabler name="shield-check" class="tip-icon"></i-tabler>
        <span>Seguridad garantizada</span>
      </div>
      <div class="tip-item">
        <i-tabler name="clock" class="tip-icon"></i-tabler>
        <span>Casi listo</span>
      </div>
      <div class="tip-item">
        <i-tabler name="circle-check" class="tip-icon"></i-tabler>
        <span>Sin costos ocultos</span>
      </div>
    </div>
    }
  </div>
</div>
